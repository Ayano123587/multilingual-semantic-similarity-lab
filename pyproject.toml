[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "multilingual-semantic-similarity-lab"
version = "0.1.0"
description = "Real multilingual sentence relatedness with auditable training and evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "scipy>=1.14,<2", "scikit-learn>=1.6,<2", "torch>=2.6,<3", "transformers>=4.57,<5", "sentencepiece>=0.2,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
notebook = ["jupyter>=1,<2", "matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
